<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="ja">
<head>

<title>SUBWAY — QR打刻</title>
<style>/*<![CDATA[*/
:root{--bg:#F4F2EC;--card:#FFFFFF;--ink:#1F2328;--muted:#6B7280;--line:#E3DFD3;--green:#1F7A4A;}
@media (prefers-color-scheme:dark){:root{--bg:#111417;--card:#1A1E23;--ink:#ECEFF3;--muted:#9AA3AE;--line:#2A3038;}}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums;}
#kiosk{max-width:1100px;margin:0 auto;padding:14px 16px 28px;}
.k-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.k-store{font-size:18px;}
.k-lang{display:flex;gap:2px;background:var(--line);border-radius:999px;padding:3px;}
.k-lang button{border:none;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:6px 11px;border-radius:999px;cursor:pointer;}
.k-lang button.on{background:var(--card);color:var(--ink);}
.k-time{display:flex;align-items:baseline;gap:12px;justify-content:center;margin:8px 0 12px;}
.k-clock{font-size:44px;font-weight:800;letter-spacing:1px;}
.k-clock small{font-size:20px;color:var(--muted);}
.k-date{font-size:15px;color:var(--muted);font-weight:600;}
.k-main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start;}
@media (max-width:760px){.k-main{grid-template-columns:1fr;}}
.k-stage{position:relative;aspect-ratio:4/3;background:#0B0D10;border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.18);}
.k-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
.k-stage.live video{display:block;}
.k-stage.mirror video{transform:scaleX(-1);}
.k-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#9AA3AE;font-size:16px;text-align:center;padding:20px;}
.k-ph-ic{font-size:46px;opacity:.7;}
.k-stage.live .k-ph{display:none;}
.k-frame{position:absolute;left:50%;top:50%;width:58%;aspect-ratio:1/1;transform:translate(-50%,-50%);display:none;pointer-events:none;}
.k-stage.live .k-frame{display:block;}
.k-frame i{position:absolute;width:15%;height:15%;border:5px solid #fff;filter:drop-shadow(0 0 3px rgba(0,0,0,.5));}
.k-frame i:nth-child(1){left:0;top:0;border-right:none;border-bottom:none;border-radius:12px 0 0 0;}
.k-frame i:nth-child(2){right:0;top:0;border-left:none;border-bottom:none;border-radius:0 12px 0 0;}
.k-frame i:nth-child(3){left:0;bottom:0;border-right:none;border-top:none;border-radius:0 0 0 12px;}
.k-frame i:nth-child(4){right:0;bottom:0;border-left:none;border-top:none;border-radius:0 0 12px 0;}
.k-tag{position:absolute;left:12px;top:12px;color:#fff;font-weight:800;font-size:18px;padding:6px 14px;border-radius:999px;display:none;}
.k-stage.live .k-tag{display:block;}
.k-tag:empty{display:none !important;}
.k-cam,.k-stopb{position:absolute;top:12px;border:none;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:14px;font-weight:700;padding:8px 13px;cursor:pointer;}
.k-cam{right:12px;}
.k-stopb{right:12px;top:auto;bottom:12px;display:none;}
.k-stage.live .k-stopb{display:block;}
.k-res{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;text-align:center;padding:20px;}
.k-res.show{display:flex;animation:kin .16s ease-out;}
@keyframes kin{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:none;}}
.k-ok{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;}
.k-nm{font-size:32px;font-weight:800;}
.k-kd{font-size:20px;font-weight:600;}
.k-kd b{font-size:32px;margin-left:6px;}
.k-note{font-size:16px;background:rgba(0,0,0,.2);border-radius:10px;padding:3px 12px;}
.k-msg{font-size:19px;font-weight:700;max-width:440px;line-height:1.5;}
.k-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px;visibility:hidden;}
.k-bar.live{visibility:visible;}
.k-bar i{display:block;height:100%;width:0;background:var(--green);transition:width .25s linear;}
.k-status{text-align:center;font-size:16px;font-weight:700;min-height:26px;margin-top:8px;}
.k-status.bad{color:#C53030;}
.k-kinds{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (min-width:761px){.k-kinds{grid-template-columns:1fr;}}
.k-kind{border:none;border-radius:16px;padding:16px 12px;background:var(--ak);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .08s,box-shadow .12s;font-family:inherit;}
.k-kind:active{transform:scale(.97);}
.k-kind.sel{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--ak);}
.k-kind i{font-style:normal;font-size:22px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;}
.k-kind b{font-size:22px;letter-spacing:.5px;}
.k-recent{margin-top:16px;}
.k-rec-h{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:4px;}
.k-rec{display:flex;align-items:center;gap:10px;font-size:15px;padding:7px 2px;border-bottom:1px dashed var(--line);}
.k-rec b{max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.k-rec span{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.k-rec em{font-style:normal;font-weight:700;}
.k-rec.err span{color:#C53030;}
.k-rec .k-dot{flex:0 0 10px;width:10px;height:10px;border-radius:50%;}
.k-foot{font-size:12.5px;color:var(--muted);margin-top:16px;text-align:center;}
.k-go{border:none;border-radius:999px;background:#1F7A4A;color:#fff;font-size:20px;font-weight:800;padding:14px 26px;cursor:pointer;box-shadow:0 6px 20px -8px rgba(31,122,74,.8);}
.k-ph-sub{font-size:13px;color:#7C8590;}
.k-pick{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(11,13,16,.88);color:#fff;padding:14px;text-align:center;}
.k-pick.show{display:flex;animation:kin .16s ease-out;}
.k-pnm{font-size:30px;font-weight:800;}
.k-ptoday{font-size:14px;color:#C9D1D9;}
.k-pkinds{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(460px,100%);}
.k-pk{position:relative;border:none;border-radius:14px;background:var(--ak);color:#fff;padding:14px 10px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;font-size:18px;}
.k-pk b{font-size:19px;} .k-pk i{font-style:normal;}
.k-pk[disabled]{opacity:.25;cursor:default;}
.k-pk.sug{box-shadow:0 0 0 3px #0B0D10,0 0 0 6px #fff;}
.k-cd{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*360deg),rgba(255,255,255,.25) 0);color:var(--ak);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;}
.k-pnote{font-size:14px;color:#E5E7EB;}
.k-pcancel{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:999px;padding:6px 16px;font-size:14px;cursor:pointer;}

<div id="kiosk"></div>
<script>//<![CDATA[
(function(){ "use strict";
  var QR = (function () {
    // --- GF(256), đa thức nguyên thuỷ 0x11D ---------------------------------
    var EXP = new Array(512), LOG = new Array(256);
    (function () {
      for (var i = 0, x = 1; i < 255; i++) {
        EXP[i] = x; LOG[x] = i;
        x <<= 1; if (x & 0x100) x ^= 0x11D;
      }
      for (var j = 255; j < 512; j++) EXP[j] = EXP[j - 255];
    })();
    function gmul(a, b) { return (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]]; }

    // --- Bảng khối cho mức sửa lỗi M ---------------------------------------
    // [số mã sửa lỗi mỗi khối, số khối nhóm 1, số mã dữ liệu nhóm 1, số khối nhóm 2, số mã dữ liệu nhóm 2]
    var ECB = {
      1:[10,1,16,0,0], 2:[16,1,28,0,0], 3:[26,1,44,0,0],  4:[18,2,32,0,0],  5:[24,2,43,0,0],
      6:[16,4,27,0,0], 7:[18,4,31,0,0], 8:[22,2,38,2,39], 9:[22,3,36,2,37], 10:[26,4,43,1,44]
    };
    var ALIGN = {
      1:[], 2:[6,18], 3:[6,22], 4:[6,26], 5:[6,30],
      6:[6,34], 7:[6,22,38], 8:[6,24,42], 9:[6,26,46], 10:[6,28,50]
    };

    function dataCodewords(v) { var e = ECB[v]; return e[1] * e[2] + e[3] * e[4]; }
    function byteCapacity(v) { return dataCodewords(v) - (v < 10 ? 2 : 3); }

    function utf8(str) {
      var out = [], s = encodeURIComponent(str);
      for (var i = 0; i < s.length; i++) {
        if (s[i] === '%') { out.push(parseInt(s.substr(i + 1, 2), 16)); i += 2; }
        else out.push(s.charCodeAt(i));
      }
      return out;
    }

    function bitLen(x) { var n = 0; while (x) { n++; x >>>= 1; } return n; }

    function formatBits(mask) {          // mức M = 0b00
      var data = (0 << 3) | mask, rem = data << 10;
      while (bitLen(rem) >= 11) rem ^= 0x537 << (bitLen(rem) - 11);
      return (((data << 10) | rem) ^ 0x5412) & 0x7FFF;
    }
    function versionBits(v) {
      var rem = v << 12;
      while (bitLen(rem) >= 13) rem ^= 0x1F25 << (bitLen(rem) - 13);
      return ((v << 12) | rem) & 0x3FFFF;
    }

    function rsGen(n) {
      var poly = [1];
      for (var i = 0; i < n; i++) {
        var next = new Array(poly.length + 1).fill(0);
        for (var j = 0; j < poly.length; j++) {
          next[j] ^= poly[j];                       // phần nhân với x
          next[j + 1] ^= gmul(poly[j], EXP[i]);     // phần nhân với α^i
        }
        poly = next;
      }
      return poly;
    }
    function rsEncode(data, n) {
      var gen = rsGen(n), res = new Array(n).fill(0);
      for (var i = 0; i < data.length; i++) {
        var f = data[i] ^ res[0];
        res.shift(); res.push(0);
        for (var j = 0; j < n; j++) res[j] ^= gmul(gen[j + 1], f);
      }
      return res;
    }

    var MASKS = [
      function (i, j) { return (i + j) % 2 === 0; },
      function (i) { return i % 2 === 0; },
      function (i, j) { return j % 3 === 0; },
      function (i, j) { return (i + j) % 3 === 0; },
      function (i, j) { return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 === 0; },
      function (i, j) { return (i * j) % 2 + (i * j) % 3 === 0; },
      function (i, j) { return ((i * j) % 2 + (i * j) % 3) % 2 === 0; },
      function (i, j) { return ((i + j) % 2 + (i * j) % 3) % 2 === 0; }
    ];

    function build(text) {
      var bytes = utf8(text), v = 0;
      for (var t = 1; t <= 10; t++) if (byteCapacity(t) >= bytes.length) { v = t; break; }
      if (!v) throw new Error('Nội dung quá dài cho mã QR (tối đa ' + byteCapacity(10) + ' ký tự).');

      // --- chuỗi bit dữ liệu ---
      var bits = [];
      function put(val, len) { for (var k = len - 1; k >= 0; k--) bits.push((val >>> k) & 1); }
      put(4, 4);                              // chế độ byte
      put(bytes.length, v < 10 ? 8 : 16);
      bytes.forEach(function (b) { put(b, 8); });

      var total = dataCodewords(v) * 8;
      for (var p = 0; p < 4 && bits.length < total; p++) bits.push(0);   // dấu kết thúc
      while (bits.length % 8) bits.push(0);
      var pad = [0xEC, 0x11], pi = 0;
      while (bits.length < total) { put(pad[pi++ % 2], 8); }

      var cw = [];
      for (var b2 = 0; b2 < bits.length; b2 += 8) {
        var n = 0; for (var k2 = 0; k2 < 8; k2++) n = (n << 1) | bits[b2 + k2];
        cw.push(n);
      }

      // --- chia khối, sinh mã sửa lỗi, đan xen ---
      var e = ECB[v], blocks = [], ecs = [], off = 0;
      function take(count, size) {
        for (var i = 0; i < count; i++) {
          var d = cw.slice(off, off + size); off += size;
          blocks.push(d); ecs.push(rsEncode(d, e[0]));
        }
      }
      take(e[1], e[2]); take(e[3], e[4]);

      var out = [], maxD = Math.max(e[2], e[4] || 0);
      for (var i2 = 0; i2 < maxD; i2++)
        for (var b3 = 0; b3 < blocks.length; b3++)
          if (i2 < blocks[b3].length) out.push(blocks[b3][i2]);
      for (var i3 = 0; i3 < e[0]; i3++)
        for (var b4 = 0; b4 < ecs.length; b4++) out.push(ecs[b4][i3]);

      // --- khung ma trận ---
      var size = v * 4 + 17;
      var m = [], reserved = [];
      for (var r = 0; r < size; r++) {
        m.push(new Array(size).fill(false));
        reserved.push(new Array(size).fill(false));
      }
      function setF(r2, c2, val) { m[r2][c2] = val; reserved[r2][c2] = true; }

      function finder(r3, c3) {
        for (var dr = -1; dr <= 7; dr++) for (var dc = -1; dc <= 7; dc++) {
          var rr = r3 + dr, cc = c3 + dc;
          if (rr < 0 || cc < 0 || rr >= size || cc >= size) continue;
          var inner = Math.max(Math.abs(dr - 3), Math.abs(dc - 3));
          setF(rr, cc, inner !== 2 && inner <= 3);
        }
      }
      finder(0, 0); finder(0, size - 7); finder(size - 7, 0);

      for (var i4 = 8; i4 < size - 8; i4++) {                 // vạch nhịp
        setF(6, i4, i4 % 2 === 0); setF(i4, 6, i4 % 2 === 0);
      }
      var ac = ALIGN[v];                                       // ô căn chỉnh
      ac.forEach(function (ar) {
        ac.forEach(function (acx) {
          if ((ar === 6 && acx === 6) || (ar === 6 && acx === size - 7) || (ar === size - 7 && acx === 6)) return;
          for (var dr2 = -2; dr2 <= 2; dr2++) for (var dc2 = -2; dc2 <= 2; dc2++)
            setF(ar + dr2, acx + dc2, Math.max(Math.abs(dr2), Math.abs(dc2)) !== 1);
        });
      });
      setF(size - 8, 8, true);                                 // ô tối cố định

      for (var i5 = 0; i5 < 9; i5++) {                         // chỗ dành cho thông tin định dạng
        if (i5 !== 6) { reserved[8][i5] = true; reserved[i5][8] = true; }
      }
      for (var i6 = 0; i6 < 8; i6++) { reserved[8][size - 1 - i6] = true; reserved[size - 1 - i6][8] = true; }
      reserved[8][6] = true; reserved[6][8] = true;

      if (v >= 7) {
        var vb = versionBits(v);
        for (var i7 = 0; i7 < 18; i7++) {
          var bit = ((vb >>> i7) & 1) === 1;
          setF(Math.floor(i7 / 3), size - 11 + (i7 % 3), bit);
          setF(size - 11 + (i7 % 3), Math.floor(i7 / 3), bit);
        }
      }

      // --- rải dữ liệu theo đường zigzag ---
      var di = 0, dbit = 0, upward = true;
      for (var col = size - 1; col >= 0; col -= 2) {
        if (col === 6) col--;
        for (var rowStep = 0; rowStep < size; rowStep++) {
          var row = upward ? size - 1 - rowStep : rowStep;
          for (var cOff = 0; cOff < 2; cOff++) {
            var c4 = col - cOff;
            if (reserved[row][c4]) continue;
            var val = false;
            if (di < out.length) val = ((out[di] >>> (7 - dbit)) & 1) === 1;
            m[row][c4] = val;
            dbit++; if (dbit === 8) { dbit = 0; di++; }
          }
        }
        upward = !upward;
      }

      // --- chọn mặt nạ tốt nhất ---
      var best = null, bestScore = Infinity;
      for (var mk = 0; mk < 8; mk++) {
        var cand = m.map(function (r5) { return r5.slice(); });
        for (var r6 = 0; r6 < size; r6++) for (var c5 = 0; c5 < size; c5++)
          if (!reserved[r6][c5] && MASKS[mk](r6, c5)) cand[r6][c5] = !cand[r6][c5];

        var fb = formatBits(mk);
        for (var i8 = 0; i8 < 15; i8++) {
          var fbit = ((fb >>> i8) & 1) === 1;
          // Bản 1: chạy dọc cột 8 rồi quặt sang hàng 8 quanh ô định vị góc trên trái.
          if (i8 < 6) cand[i8][8] = fbit;
          else if (i8 === 6) cand[7][8] = fbit;
          else if (i8 === 7) cand[8][8] = fbit;
          else if (i8 === 8) cand[8][7] = fbit;
          else cand[8][14 - i8] = fbit;
          // Bản 2: hàng 8 phía phải, rồi cột 8 phía dưới.
          if (i8 < 8) cand[8][size - 1 - i8] = fbit;
          else cand[size - 15 + i8][8] = fbit;
        }
        cand[size - 8][8] = true;

        var sc = penalty(cand, size);
        if (sc < bestScore) { bestScore = sc; best = cand; }
      }
      return best;
    }

    function penalty(m, size) {
      var score = 0, i, j, run, dark = 0;
      for (i = 0; i < size; i++) {                              // quy tắc 1: dãy cùng màu
        run = 1;
        for (j = 1; j < size; j++) {
          if (m[i][j] === m[i][j - 1]) { run++; if (run === 5) score += 3; else if (run > 5) score++; }
          else run = 1;
        }
        run = 1;
        for (j = 1; j < size; j++) {
          if (m[j][i] === m[j - 1][i]) { run++; if (run === 5) score += 3; else if (run > 5) score++; }
          else run = 1;
        }
      }
      for (i = 0; i < size - 1; i++) for (j = 0; j < size - 1; j++) {   // quy tắc 2: khối 2x2
        var a = m[i][j];
        if (a === m[i][j + 1] && a === m[i + 1][j] && a === m[i + 1][j + 1]) score += 3;
      }
      var pat1 = [true, false, true, true, true, false, true, false, false, false, false];
      var pat2 = [false, false, false, false, true, false, true, true, true, false, true];
      function match(get, n) {                                   // quy tắc 3: hình giống vạch định vị
        for (var s = 0; s + 11 <= n; s++) {
          var ok1 = true, ok2 = true;
          for (var k = 0; k < 11; k++) {
            if (get(s + k) !== pat1[k]) ok1 = false;
            if (get(s + k) !== pat2[k]) ok2 = false;
          }
          if (ok1) score += 40;
          if (ok2) score += 40;
        }
      }
      for (i = 0; i < size; i++) {
        (function (r) { match(function (k) { return m[r][k]; }, size); })(i);
        (function (c) { match(function (k) { return m[k][c]; }, size); })(i);
      }
      for (i = 0; i < size; i++) for (j = 0; j < size; j++) if (m[i][j]) dark++;
      var pct = dark * 100 / (size * size);                      // quy tắc 4: tỉ lệ đen/trắng
      score += Math.floor(Math.abs(pct - 50) / 5) * 10;
      return score;
    }

    /** Trả về chuỗi SVG vuông, nền trắng, viền trắng 4 ô theo chuẩn. */
    function svg(text, px, opts) {
      opts = opts || {};
      var m = build(text), n = m.length, q = (opts.quiet === undefined) ? 4 : opts.quiet;
      var total = n + q * 2, d = '';
      for (var r = 0; r < n; r++) {
        var c = 0;
        while (c < n) {
          if (!m[r][c]) { c++; continue; }
          var start = c;
          while (c < n && m[r][c]) c++;
          d += 'M' + (start + q) + ' ' + (r + q) + 'h' + (c - start) + 'v1h-' + (c - start) + 'z';
        }
      }
      return '<svg xmlns="http://www.w3.org/2000/svg" width="' + px + '" height="' + px +
        '" viewBox="0 0 ' + total + ' ' + total + '" shape-rendering="crispEdges" role="img">' +
        '<rect width="' + total + '" height="' + total + '" fill="#fff"/>' +
        '<path d="' + d + '" fill="' + (opts.color || '#000') + '"/></svg>';
    }

    return { build: build, svg: svg, capacity: byteCapacity,
             _t: { EXP: EXP, LOG: LOG, ECB: ECB, ALIGN: ALIGN, MASKS: MASKS, formatBits: formatBits } };   // cho bộ đọc QRD
